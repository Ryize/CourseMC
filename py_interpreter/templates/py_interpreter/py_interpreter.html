{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Твой интерпретатор</title>
    <link rel="shortcut icon"
          href="{% static 'Course/assets/favicon.ico' %}"
          type="image/x-icon">
    <link rel="stylesheet"
          href="{% static 'Course/css/style.css' %}">
    <link rel="stylesheet"
          href="{% static 'py_interpreter/interpreter.css' %}">
    <script src="{% static 'py_interpreter/interpreter.js' %}" defer></script>
</head>
<body class="interpreter-page">
{% include 'template/header.html' %}

<main class="interpreter"
      data-worker-url="{% static 'py_interpreter/worker.mjs' %}?v=2">
    <div class="interpreter__heading">
        <div>
            <h1>Твой Интерпретатор</h1>
            <p>Онлайн запуск Python кода.</p>
            <p>Код выполняется только в вашем браузере.</p>
        </div>
        <span class="interpreter__status"
              id="interpreter-status"
              role="status">Загрузка Python…</span>
    </div>
    <section class="interpreter__workspace"
             aria-label="Python-интерпретатор">
        <div class="interpreter__panel">
            <label for="python-code">Код Python</label>
            <textarea id="python-code"
                      spellcheck="false"
                      autocomplete="off"
                      maxlength="20000">def main():
    print("Hello, CourseMC!")


main()</textarea>
        </div>

        <div class="interpreter__panel">
            <div class="interpreter__output-heading">
                <label for="python-output">Результат</label>
                <button type="button"
                        class="interpreter__clear"
                        id="clear-output">Очистить</button>
            </div>
            <pre id="python-output"
                 tabindex="0"
                 aria-live="polite">Интерпретатор загружается…</pre>
        </div>
    </section>

    <div class="interpreter__actions">
        <button type="button" id="run-code" disabled>Запустить</button>
        <button type="button"
                class="interpreter__stop"
                id="stop-code"
                disabled>Остановить</button>
    </div>

    <noscript>
        Для работы интерпретатора необходимо включить JavaScript.
    </noscript>
</main>

{% include 'template/footer.html' %}
</body>
</html>
