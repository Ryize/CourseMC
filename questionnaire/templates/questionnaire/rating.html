{% extends 'questionnaire/template/base.html' %}

{% block title %}Оценка опроса — CourseMC{% endblock %}

{% block content %}
    <section class="questionnaire-card questionnaire-rating-card">
        <p class="questionnaire-kicker">Опрос завершён</p>
        <h1>Как тебе «{{ poll.title }}»?</h1>
        <p>Оценка поможет автору сделать следующие опросы понятнее и полезнее.</p>
        <form class="questionnaire-form" method="post">
            {% csrf_token %}
            <fieldset>
                <legend class="questionnaire-kicker">Твоя оценка</legend>
                <div class="questionnaire-rating-stars">
                    <input type="radio" id="star-5" name="rating" value="5" required>
                    <label for="star-5" title="5 из 5"><span class="visually-hidden">5 из 5</span></label>
                    <input type="radio" id="star-4" name="rating" value="4">
                    <label for="star-4" title="4 из 5"><span class="visually-hidden">4 из 5</span></label>
                    <input type="radio" id="star-3" name="rating" value="3">
                    <label for="star-3" title="3 из 5"><span class="visually-hidden">3 из 5</span></label>
                    <input type="radio" id="star-2" name="rating" value="2">
                    <label for="star-2" title="2 из 5"><span class="visually-hidden">2 из 5</span></label>
                    <input type="radio" id="star-1" name="rating" value="1">
                    <label for="star-1" title="1 из 5"><span class="visually-hidden">1 из 5</span></label>
                </div>
            </fieldset>
            <div class="questionnaire-field">
                <label for="rating-comment">Комментарий <span>(необязательно)</span></label>
                <textarea id="rating-comment" rows="5" maxlength="750" name="comment"
                          placeholder="Что было понятно, а что стоит улучшить?"></textarea>
            </div>
            <div class="questionnaire-form-actions">
                <button class="questionnaire-button questionnaire-button--warm" type="submit">Отправить отзыв</button>
            </div>
        </form>
    </section>
{% endblock %}
