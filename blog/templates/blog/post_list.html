{% load static %}
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Твои статьи - CourseMC</title>
    <link rel="stylesheet" href="{% static 'Course/css/style.css' %}?v=20260812-5">
    <link rel="shortcut icon" href="{% static 'Course/assets/favicon.ico' %}" type="image/x-icon">
</head>
<style>
    html,
    body {
        max-width: 100%;
        overflow-x: hidden;
    }
</style>

<body onclick="closeAll()">
	{% include 'template/header.html' %}

<section class="scheduleSection">
    <div class="title blog">
        <h2 onclick="document.location=`{% url 'blog_home' %}`" style="cursor: pointer;">Блог</h2>

        <div class="controlls">
            {% if user.is_authenticated %}
                <button><a href="{% url 'create_post' %}">Создать статью</a></button>
                <button><a href="{% url 'my_post' %}">Мои статьи</a></button>
            {% endif %}
            <div class="filter">
                <button class="select" type="button" onclick="activeFilter()"
                        aria-label="Открыть фильтр статей">
                    <p>Фильтровать</p>
                    <ion-icon name="chevron-down-outline"></ion-icon>
                </button>

                <div class="dropdown-filter">
                    <div class="active">
                        <button type="button" data-blog-filter="">Все</button>
                    </div>
                    {% for category in filter_categories %}
                        <div>
                            <button type="button"
                                    data-blog-filter="{{ category.title }}">
                                {{ category.title }}
                            </button>
                        </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>

    <div class="list blog"></div>
    <p class="blog-empty-state" hidden>
        В этой категории пока нет статей.
    </p>

    <nav class="pagination-container">
        <button class="back">
            <ion-icon name="chevron-back-outline"></ion-icon>
        </button>
        <div id="pagination-numbers"></div>
        <button class="next">
            <ion-icon name="chevron-forward-outline"></ion-icon>
        </button>
    </nav>
</section>

<script>
    const box = document.querySelector('.list')

    const itemsMain = [
        {% for post in posts %}
            {% if post.is_displayed or post.author == user %}
                {
                    id: {{ post.pk }},
                    categories: [{% for category in post.categories.all %}'{{ category|escapejs }}',{% endfor %}],
                    name: '{{ post.title|escapejs }}',
                    text: '{{ post.description|escapejs }}',
                    autor: '{{ post.author|escapejs }}',
                    date: '{{ post.created_at|date:"j E Y г. H:i"|escapejs }}',
                    image: '{{ post.image.url|escapejs }}',
                    url: 'onclick="document.location=`{% url 'post_view' post.pk %}`"'
                },
            {% endif %}
        {% endfor %}
    ].reverse()

    box.innerHTML = itemsMain.map(item => (
        `<div id="dropdown-blog" class="item" ${item.url}>
                <img src="${item.image}" />

                <div class="box">
                    <div class="categories">${item.categories.map(cat => `<div>${cat}</div>`).join(' ')}</div>

                    <div class="info">
                        <h3>${item.name}</h3>
                        <p>${item.text}</p>
                    </div>

                    <div class="autor">
                        <h4>${item.autor}
{% if my_post %}
<a href='../change_post/${item.id}'>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pencil" viewBox="0 0 16 16">
  <path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168l10-10zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207 11.207 2.5zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293l6.5-6.5zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325z"/>
</svg>
</a>
{% endif %}
</h4>
                        <p>${item.date}</p>
                    </div>
                </div>
            </div>`
    )).join(' ')


    const listItemsBlog = Array.from(document.querySelectorAll("#dropdown-blog"));
    const backBlog = document.querySelector(".back");
    const nextBlog = document.querySelector(".next");
    const paginationNumbersBlog = document.getElementById("pagination-numbers");
    const paginationContainerBlog = document.querySelector(".pagination-container");
    const emptyStateBlog = document.querySelector(".blog-empty-state");
    const blogFilter = document.querySelector(".title.blog .filter");
    const blogFilterDropdown = blogFilter.querySelector(".dropdown-filter");
    const blogFilterButtons = blogFilter.querySelectorAll("[data-blog-filter]");

    const paginationLimitBlog = 9;
    let filteredItemsBlog = listItemsBlog;
    let pageCountBlog = Math.ceil(filteredItemsBlog.length / paginationLimitBlog);
    let currentPageBlog = 1;

    const appendPageNumberBlog = (index) => {
        const pageNumberBlog = document.createElement("button");
        pageNumberBlog.className = "blog-pagination-number";
        pageNumberBlog.innerHTML = index;
        pageNumberBlog.setAttribute("page-index", index);
        pageNumberBlog.setAttribute("aria-label", "Страница " + index);
        pageNumberBlog.addEventListener("click", () => {
            setCurrentPageBlog(index);
        });

        paginationNumbersBlog.appendChild(pageNumberBlog);
    };

    const getPaginationNumbersBlog = () => {
        paginationNumbersBlog.innerHTML = "";
        pageCountBlog = Math.ceil(filteredItemsBlog.length / paginationLimitBlog);
        for (let i = 1; i <= pageCountBlog; i++) {
            appendPageNumberBlog(i);
        }
        paginationContainerBlog.hidden = pageCountBlog <= 1;
    };

    const handleActivePageNumberBlog = () => {
        document.querySelectorAll(".blog-pagination-number").forEach((button) => {
            button.classList.remove("active");
            const pageIndex = Number(button.getAttribute("page-index"));
            if (pageIndex === currentPageBlog) {
                button.classList.add("active");
            }
        });
    };

    function setCurrentPageBlog(pageNum) {
        currentPageBlog = pageNum;
        handleActivePageNumberBlog();

        const prevRange = (pageNum - 1) * paginationLimitBlog;
        const currRange = pageNum * paginationLimitBlog;

        listItemsBlog.forEach((item) => item.classList.add("hidden"));
        filteredItemsBlog.forEach((item, index) => {
            if (index >= prevRange && index < currRange) {
                item.classList.remove("hidden");
            }
        });
    };

    function applyBlogFilter(category) {
        filteredItemsBlog = listItemsBlog.filter((item, index) => (
            !category || itemsMain[index].categories.includes(category)
        ));

        blogFilterButtons.forEach((button) => {
            button.parentElement.classList.toggle(
                "active",
                button.dataset.blogFilter === category
            );
        });

        emptyStateBlog.hidden = filteredItemsBlog.length > 0;
        getPaginationNumbersBlog();
        if (filteredItemsBlog.length > 0) {
            setCurrentPageBlog(1);
        } else {
            listItemsBlog.forEach((item) => item.classList.add("hidden"));
        }

        blogFilterDropdown.classList.remove("active");
        blogFilter.classList.remove("active");
    }

    blogFilterButtons.forEach((button) => {
        button.addEventListener("click", () => {
            applyBlogFilter(button.dataset.blogFilter);
        });
    });

    backBlog.addEventListener('click', () => {
        if (currentPageBlog > 1) {
            setCurrentPageBlog(currentPageBlog - 1);
        }
    })

    nextBlog.addEventListener('click', () => {
        if (currentPageBlog < pageCountBlog) {
            setCurrentPageBlog(currentPageBlog + 1);
        }
    })

    window.addEventListener("load", () => {
        getPaginationNumbersBlog();
        setCurrentPageBlog(1);
    });
</script>


{% include 'template/footer.html' %}
</body>

</html>
